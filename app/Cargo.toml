[workspace]
members = [
    "crates/diagram-core",
    "crates/diagram-canvas",
    "crates/diagram-storage",
    "crates/diagram-desktop",
]
resolver = "3"

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.99"
publish = false
repository = "https://github.com/DAWAS00/Diagrams"

[workspace.dependencies]
diagram-core = { path = "crates/diagram-core" }
diagram-canvas = { path = "crates/diagram-canvas" }
diagram-storage = { path = "crates/diagram-storage" }
thiserror = "2.0.21"
eframe = "0.37.0"
egui_kittest = "0.37.0"
rusqlite = { version = "0.41.1", features = ["bundled"] }
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
redundant_clone = "warn"
needless_collect = "warn"
clone_on_copy = "warn"
large_enum_variant = "warn"
missing_errors_doc = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
